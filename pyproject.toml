[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-shift-sim"
version = "0.1.0"
description = "SOC Shift Simulator: an incident-investigation training range in a box (synthetic logs only)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Abdulmohsen Alharbi" }]
keywords = ["soc", "blue-team", "mitre-attack", "detection", "training", "dfir"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sim = "socsim.cli:main"

[project.urls]
Homepage = "https://github.com/2m7sn/soc-shift-sim"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
